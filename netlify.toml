[build]
  command = "node scripts/netlify-build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# API proxy rules are generated into dist/_redirects by the build script.
# Set PAWCARE_API_ORIGIN to the hosted Express server's HTTPS origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
